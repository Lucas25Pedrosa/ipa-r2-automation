name: TeraBox Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          ref: terabox-archive

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Instalar cliente TeraBox
        run: npm install --no-save --ignore-scripts terabox-upload-tool@1.4.1

      - name: Criar arquivo de teste
        run: |
          mkdir -p .terabox-test
          printf 'TeraBox GitHub Actions test\n' > .terabox-test/terabox-test.txt

      - name: Testar upload TeraBox
        env:
          TERABOX_NDUS: ${{ secrets.TERABOX_NDUS }}
          TERABOX_JS_TOKEN: ${{ secrets.TERABOX_JS_TOKEN }}
          TERABOX_APP_ID: ${{ secrets.TERABOX_APP_ID }}
          LOCAL_FILE: .terabox-test/terabox-test.txt
          REMOTE_DIR: /IPAS/Teste/0.0.0
        run: node scripts/terabox_upload.js
