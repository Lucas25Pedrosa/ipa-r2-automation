name: Fix Feather JSON once

on:
  push:
    paths:
      - '.github/workflows/fix-feather-json-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix empty Instagram dates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Feather/feather.json')
          text = path.read_text(encoding='utf-8')

          marker = '"name": "Instagram"'
          start = text.find(marker)
          if start == -1:
              raise SystemExit('Instagram block not found')

          next_app = text.find('\n    },\n    {', start)
          if next_app == -1:
              raise SystemExit('End of Instagram block not found')

          block = text[start:next_app]
          old_block = block
          block = block.replace('"date": "",', '"date": "2026-10-19T13:47:46Z",', 1)
          block = block.replace('"versionDate": "",', '"versionDate": "2026-10-19T13:47:46Z",', 1)

          if block == old_block:
              raise SystemExit('No empty Instagram date fields found')
          if '"date": "",' in block or '"versionDate": "",' in block:
              raise SystemExit('Empty Instagram date field remains after fix')

          path.write_text(text[:start] + block + text[next_app:], encoding='utf-8')
          PY

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-feather-json-once.yml
          git add Feather/feather.json
          git commit -m "Fix Feather source Instagram date"
          git push
