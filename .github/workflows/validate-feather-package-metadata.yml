name: Validate Feather Package Metadata

on:
  push:
    paths:
      - ".github/workflows/validate-feather-package-metadata.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Python and workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml telethon
          python -m py_compile .github/scripts/feather_package_metadata.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/feather-source.yml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))

          job = data['jobs']['atualizar-source']
          step_names = [step.get('name') for step in job['steps']]

          assert 'Aplicar metadados de pacote do Injector' in step_names
          assert 'Salvar atualização no repositório público' in step_names
          print('✅ Python e workflow Feather Source válidos')
          PY
