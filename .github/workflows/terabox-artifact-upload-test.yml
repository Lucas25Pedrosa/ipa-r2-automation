name: TeraBox Artifact Upload Test

on:
  workflow_run:
    workflows: ["TeraBox Artifact Source Test"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  upload-to-terabox:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Instalar cliente TeraBox
        run: npm install --no-save --ignore-scripts terabox-upload-tool@1.4.1

      - name: Baixar Artifact do workflow anterior
        uses: actions/download-artifact@v4
        with:
          name: terabox-archive-test
          path: .terabox-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Enviar Artifact ao TeraBox
        env:
          TERABOX_NDUS: ${{ secrets.TERABOX_NDUS }}
          TERABOX_JS_TOKEN: ${{ secrets.TERABOX_JS_TOKEN }}
          TERABOX_APP_ID: ${{ secrets.TERABOX_APP_ID }}
          LOCAL_FILE: .terabox-artifact/Artifact_Test_0.0.0.txt
          REMOTE_DIR: /IPAS/Teste/Artifact
        run: node scripts/terabox_upload.js

      - name: Apagar Artifact após upload confirmado
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          ARTIFACT_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "terabox-archive-test") | .id' \
            | head -n 1)"

          if [ -z "$ARTIFACT_ID" ]; then
            echo "Artifact já ausente ou não localizado; nada para apagar."
            exit 0
          fi

          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"

          echo "Artifact ${ARTIFACT_ID} removido após confirmação do upload."
