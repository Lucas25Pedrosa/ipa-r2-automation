name: Azure Translator Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/azure-translator-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test Azure Translator authentication
        env:
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
          AZURE_TRANSLATOR_ENDPOINT: ${{ secrets.AZURE_TRANSLATOR_ENDPOINT }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          key = os.environ.get("AZURE_TRANSLATOR_KEY", "").strip()
          region = os.environ.get("AZURE_TRANSLATOR_REGION", "").strip()
          endpoint = os.environ.get(
              "AZURE_TRANSLATOR_ENDPOINT",
              "https://api.cognitive.microsofttranslator.com",
          ).strip().rstrip("/")

          parsed = urllib.parse.urlparse(endpoint)
          host = parsed.netloc or "<invalid>"

          print("Azure Translator diagnostic")
          print(f"Key present: {'yes' if bool(key) else 'no'}")
          print(f"Key length: {len(key)}")
          print(f"Region present: {'yes' if bool(region) else 'no'}")
          print(f"Endpoint host: {host}")

          if not key:
              print("RESULT: key missing")
              sys.exit(2)

          def test(label, include_region):
              query = urllib.parse.urlencode({"api-version": "3.0", "to": "pt"})
              url = f"{endpoint}/translate?{query}"
              body = json.dumps([{"Text": "Hello"}]).encode("utf-8")
              headers = {
                  "Ocp-Apim-Subscription-Key": key,
                  "Content-Type": "application/json; charset=UTF-8",
              }
              if include_region and region:
                  headers["Ocp-Apim-Subscription-Region"] = region

              req = urllib.request.Request(url, data=body, method="POST", headers=headers)

              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      status = resp.status
                      response_headers = resp.headers
                      raw = resp.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  response_headers = exc.headers
                  raw = exc.read().decode("utf-8", errors="replace")
              except Exception as exc:
                  print(f"{label} transport error: {type(exc).__name__}: {exc}")
                  return False

              print(f"{label} HTTP status: {status}")
              request_id = response_headers.get("X-RequestId") or response_headers.get("apim-request-id")
              if request_id:
                  print(f"{label} request-id: {request_id}")

              try:
                  payload = json.loads(raw)
              except Exception:
                  payload = None

              if isinstance(payload, dict) and isinstance(payload.get("error"), dict):
                  error = payload["error"]
                  print(f"{label} Azure error code: {error.get('code')}")
                  print(f"{label} Azure error message: {error.get('message')}")
              elif 200 <= status < 300 and isinstance(payload, list):
                  try:
                      translated = payload[0]["translations"][0]["text"]
                  except Exception:
                      translated = "<unreadable success payload>"
                  print(f"{label} translation result: {translated}")

              return 200 <= status < 300

          with_region = test("WITH_REGION", True)
          without_region = test("WITHOUT_REGION", False)

          print(f"WITH_REGION success: {with_region}")
          print(f"WITHOUT_REGION success: {without_region}")

          if with_region or without_region:
              print("RESULT: key is valid; authentication behavior depends on region/header mode")
              sys.exit(0)

          print("RESULT: key rejected in both authentication modes")
          sys.exit(1)
          PY
