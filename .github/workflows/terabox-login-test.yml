name: TeraBox Login Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-login:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Instalar cliente TeraBox
        run: npm install --no-save --ignore-scripts terabox-api@2.9.5

      - name: Testar login e geração da sessão
        env:
          TERABOX_EMAIL: ${{ secrets.TERABOX_EMAIL }}
          TERABOX_PASSWORD: ${{ secrets.TERABOX_PASSWORD }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { TeraBoxApp } from 'terabox-api';

          function requiredSecret(name) {
            const value = String(process.env[name] || '');
            if (!value) {
              console.error(`::error::Secret ausente: ${name}`);
              process.exit(1);
            }
            return value;
          }

          function safeMessage(value, email, password) {
            let text = String(value ?? '');
            if (email) text = text.split(email).join('[email]');
            if (password) text = text.split(password).join('[password]');
            return text.slice(0, 500);
          }

          const email = requiredSecret('TERABOX_EMAIL');
          const password = requiredSecret('TERABOX_PASSWORD');

          try {
            console.log('1/4 Iniciando pré-login no TeraBox...');
            const app = new TeraBoxApp('');
            const preLogin = await app.passportPreLogin(email);
            const preData = preLogin?.data?.seval ? preLogin.data : preLogin;
            const requiredFields = ['seval', 'random', 'timestamp'];

            if (!preData || !requiredFields.every((key) => String(preData[key] ?? '').length > 0)) {
              const code = preLogin?.code ?? 'desconhecido';
              const msg = safeMessage(preLogin?.msg ?? preLogin?.message ?? '', email, password);
              throw new Error(`pré-login recusado (code=${code}${msg ? `, msg=${msg}` : ''})`);
            }
            console.log('✅ Pré-login concluído.');

            console.log('2/4 Autenticando com e-mail e senha...');
            const login = await app.passportLogin(preData, email, password);
            const loginCode = Number(login?.code);
            if (loginCode !== 0) {
              const msg = safeMessage(login?.msg ?? login?.message ?? '', email, password);
              throw new Error(`login recusado (code=${login?.code ?? 'desconhecido'}${msg ? `, msg=${msg}` : ''})`);
            }

            const ndus = String(login?.data?.ndus || '');
            if (!ndus) throw new Error('login aceito, mas o TeraBox não retornou NDUS');
            console.log(`::add-mask::${ndus}`);
            console.log('✅ NDUS gerado com sucesso.');

            console.log('3/4 Validando a nova sessão...');
            const session = new TeraBoxApp(ndus);
            const loginCheck = await session.checkLogin();
            const errno = Number(loginCheck?.errno);
            if (errno !== 0) {
              throw new Error(`NDUS não validado (errno=${loginCheck?.errno ?? 'desconhecido'})`);
            }
            console.log('✅ Sessão NDUS válida.');

            console.log('4/4 Obtendo jsToken...');
            await session.updateAppData();
            const jsToken = String(session?.data?.jsToken || '');
            if (!jsToken) throw new Error('sessão válida, mas não foi possível obter jsToken');
            console.log(`::add-mask::${jsToken}`);

            const quota = await session.getQuota();
            const quotaErrno = Number(quota?.errno);
            if (quotaErrno !== 0) {
              throw new Error(`API autenticada recusou a consulta de quota (errno=${quota?.errno ?? 'desconhecido'})`);
            }

            console.log('✅ jsToken gerado com sucesso.');
            console.log('✅ API TeraBox validada.');
            console.log('TERABOX_LOGIN_TEST=OK');
          } catch (error) {
            const message = safeMessage(error?.message || error, email, password);
            console.error(`::error::TeraBox Login Test falhou: ${message}`);
            process.exit(1);
          }
          NODE
