name: Feather Description Guard

on:
  push:
    branches:
      - main
    paths:
      - "Feather/feather.json"
      - ".github/scripts/feather_description_guard.py"
      - ".github/workflows/feather-description-guard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate and repair Feather descriptions
        run: |
          python .github/scripts/feather_description_guard.py

      - name: Commit repaired source
        run: |
          if git diff --quiet -- Feather/feather.json; then
            echo "✅ Nenhuma correção necessária"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Feather/feather.json
          git commit -m "Repair invalid Feather app descriptions"
          git push
