name: Migrate R2 Telegram cryptg

on:
  push:
    paths:
      - .github/workflows/migrate-telegram-cryptg.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Enable cryptg
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ipa-to-r2.yml')
          text = p.read_text(encoding='utf-8')
          old = '          python -m pip install telethon requests awscli boto3\n'
          new = '          python -m pip install telethon cryptg requests awscli boto3\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('dependency line not found')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ipa-to-r2.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "perf: install cryptg for Telegram transfers"
          git push origin HEAD:main
