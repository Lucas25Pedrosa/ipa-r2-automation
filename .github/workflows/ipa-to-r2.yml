name: IPA to R2

on:
  workflow_dispatch:
    inputs:
      telegram_message_id:
        description: "ID da mensagem temporária enviada pelo bot"
        required: false
        default: ""
        type: string
      callback_url:
        description: "Callback do Worker do bot do R2"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

# Impede que o workflow principal e o relatório escrevam
# simultaneamente no Core privado.
concurrency:
  group: ipa-r2-core-write
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. BAIXAR O CORE PRIVADO
      # ============================================================

      - name: Baixar Core privado
        uses: actions/checkout@v6
        with:
          repository: Lucas25Pedrosa/ipa-r2-core
          token: ${{ secrets.R2_CORE_TOKEN }}
          path: private-core

      - name: Baixar configuração compartilhada
        uses: actions/checkout@v6
        with:
          repository: Lucas25Pedrosa/ipa-shared-config-core
          token: ${{ secrets.SHARED_CONFIG_TOKEN }}
          path: shared-config
          fetch-depth: 1


      # ============================================================
      # 2. INSTALAR DEPENDÊNCIAS
      # ============================================================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install telethon requests awscli boto3


      # ============================================================
      # 3. EXECUTAR PROCESSAMENTO PRIVADO
      # ============================================================

      - name: Executar IPA to R2
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}

          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Progresso visual temporário no Telegram.
          # O script registra a mensagem no Worker e depois a edita
          # diretamente durante download/upload, sem gravar percentuais no KV.
          TELEGRAM_START_MESSAGE_ID: ${{ inputs.telegram_message_id }}
          TELEGRAM_WORKER_CALLBACK_URL: ${{ inputs.callback_url }}
          TELEGRAM_PROGRESS_STATE_FILE: .telegram-progress.json
          CUSTOM_EMOJIS_FILE: shared-config/custom_emojis.json
          INJECTOR_R2_EMOJIS_FILE: shared-config/injector_r2_emojis.json

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python private-core/scripts/ipa_to_r2.py

      # ============================================================
      # 4. INFORMAR AO WORKER QUE O WORKFLOW TERMINOU
      # ============================================================

      - name: Finalizar notificação do /iniciar
        if: ${{ always() && inputs.telegram_message_id != '' && inputs.callback_url != '' }}
        continue-on-error: true
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          TELEGRAM_MESSAGE_ID: ${{ inputs.telegram_message_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          curl -fsS -X POST \
            "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Telegram-Bot-Token: ${TELEGRAM_BOT_TOKEN}" \
            --data "{\"telegram_message_id\":\"${TELEGRAM_MESSAGE_ID}\",\"status\":\"${JOB_STATUS}\"}" \
            >/dev/null

