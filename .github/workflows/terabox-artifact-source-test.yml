name: TeraBox Artifact Source Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Criar arquivo de teste de 50 MiB
        run: |
          mkdir -p .terabox-artifact-source
          dd if=/dev/urandom \
            of=.terabox-artifact-source/Artifact_Test_50MiB.bin \
            bs=1M count=50 status=progress
          ls -lh .terabox-artifact-source/Artifact_Test_50MiB.bin

      - name: Publicar Artifact temporário
        uses: actions/upload-artifact@v4
        with:
          name: terabox-archive-test
          path: .terabox-artifact-source/Artifact_Test_50MiB.bin
          retention-days: 1
          if-no-files-found: error
