name: Cloudflare Normalization Test

on:
  push:
    paths:
      - ".github/workflows/cloudflare-normalization-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Core privado
        uses: actions/checkout@v6
        with:
          repository: Lucas25Pedrosa/ipa-r2-core
          token: ${{ secrets.R2_CORE_TOKEN }}
          path: core

      - name: Instalar dependências
        run: python -m pip install requests langdetect

      - name: Validar normalização vinda do Worker
        env:
          TRANSLATOR_API_KEY: ${{ secrets.TRANSLATOR_API_KEY }}
          TRANSLATOR_WORKER_URL: https://ipa-translator.f8s79jzkbk.workers.dev/
        shell: python
        run: |
          import importlib.util
          import pathlib
          import re
          import sys

          path = pathlib.Path("core/scripts/feather_source.py")
          spec = importlib.util.spec_from_file_location("feather_source", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          original = "We've been polishing things behind the scenes to make BoldVoice feel faster and more reliable for you. This update includes performance improvements and bug fixes to keep your practice sessions running smoothly."
          translated = module.traduzir_texto_cloudflare(
              original,
              "teste de normalização Feather",
              "en",
          )

          print(f"translated_text={translated}")

          if re.search(r"[.!?][A-ZÀ-ÖØ-Þ]", translated):
              print("❌ O Worker devolveu pontuação sem espaço.")
              sys.exit(1)

          print("✅ Texto normalizado pelo Worker.")
