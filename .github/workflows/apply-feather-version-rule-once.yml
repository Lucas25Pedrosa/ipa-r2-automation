              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'Core patch anchor expected once, found {count}: {old[:90]!r}'
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile private-core/scripts/feather_source.py

      - name: Save private core patch
        shell: bash
        run: |
          cd private-core
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/feather_source.py
          git commit -m "Handle App Store and IPA version divergence"
          git push

      - name: Patch package metadata compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/feather_package_metadata.py')
          text = path.read_text(encoding='utf-8')

          old = '''            if normalize_version(item.get("version")) == normalize_version(app_version):
                target_version = item
                break
'''
          new = '''            source_ipa_version = (
                item.get("ipaVersion") or item.get("version")
            )
            if normalize_version(source_ipa_version) == normalize_version(app_version):
                target_version = item
                break
'''
          if text.count(old) != 1:
              raise SystemExit('Package metadata version anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    current_app_version = str(target.get("version") or "").strip()

    if normalize_version(current_app_version) == normalize_version(app_version):
'''
          new = '''    current_app_version = str(
        target.get("ipaVersion") or target.get("version") or ""
    ).strip()

    if normalize_version(current_app_version) == normalize_version(app_version):
'''
          if text.count(old) != 1:
              raise SystemExit('Package metadata top-level anchor not found exactly once')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile .github/scripts/feather_package_metadata.py

      - name: Rebuild Instagram with new rule
        env:
          SYNC_ONLY: false
          REBUILD_ALL: false
          APP_STORE_ID: '389801252'
          PUBLIC_REPO_DIR: ${{ github.workspace }}
          DRIVE_PUBLIC_BASE_URL: https://drive.lucaspedrosa.shop
          SOURCE_ICON_URL: https://raw.githubusercontent.com/Lucas25Pedrosa/ipa-r2-automation/main/Feather/icons/repo.png
          FEATHER_STATE_FILE: ${{ runner.temp }}/ipa-library-feather-state.json
          TRANSLATOR_WORKER_URL: https://ipa-translator.f8s79jzkbk.workers.dev/
          TRANSLATOR_API_KEY: ${{ secrets.TRANSLATOR_API_KEY }}
        run: |
          python private-core/scripts/feather_source.py update

      - name: Reapply Injector package metadata
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_STORAGE_CHANNEL_NAME: IPA Storage
          BUNDLE_ID: com.burbn.instagram
          IPA_VERSION: 452.0.1
          PUBLIC_REPO_DIR: ${{ github.workspace }}
        run: |
          python .github/scripts/feather_package_metadata.py

      - name: Validate result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('Feather/feather.json').read_text(encoding='utf-8'))
          app = next(a for a in data['apps'] if a.get('bundleIdentifier') == 'com.burbn.instagram')
          current = app['versions'][0]

          if app.get('ipaVersion') != '452.0.1':
              raise SystemExit(f"Unexpected top-level ipaVersion: {app.get('ipaVersion')}")
          if current.get('ipaVersion') != '452.0.1':
              raise SystemExit(f"Unexpected current ipaVersion: {current.get('ipaVersion')}")
          if app.get('version') != current.get('version'):
              raise SystemExit('Top-level and current public versions diverge')
          if current.get('localizedDescription') == 'Novidades não disponíveis.':
              raise SystemExit('App Store release notes were not inherited for same major.minor')
          if current.get('date', None) == '' or app.get('versionDate', None) == '':
              raise SystemExit('Empty date field remains')

          print('Public version:', app.get('version'))
          print('IPA version:', app.get('ipaVersion'))
          print('Release notes:', current.get('localizedDescription'))
          print('Release date:', app.get('versionDate'))
          PY

      - name: Save public changes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-feather-version-rule-once.yml
          git add .github/scripts/feather_package_metadata.py Feather/feather.json
          git commit -m "Apply App Store public version rule to Feather"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
