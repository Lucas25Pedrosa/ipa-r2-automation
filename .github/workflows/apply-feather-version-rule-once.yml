        "screenshotURLs": metadata["screenshotURLs"],
        "versions": version_entries,
        "version": str(current_entry["version"]),
        "versionDate": current_entry["date"],
        "size": current_entry["size"],
        "downloadURL": current_entry["downloadURL"],
    }
