name: Apply Feather version rule once

on:
  push:
    paths:
      - '.github/workflows/apply-feather-version-rule-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Checkout private core
        uses: actions/checkout@v4
        with:
          repository: Lucas25Pedrosa/ipa-r2-core
          token: ${{ secrets.R2_CORE_TOKEN }}
          path: private-core

      - name: Checkout shared config
        uses: actions/checkout@v4
        with:
          repository: Lucas25Pedrosa/ipa-shared-config-core
          token: ${{ secrets.SHARED_CONFIG_TOKEN }}
          path: shared-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests langdetect telethon

      - name: Patch Feather core rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('private-core/scripts/feather_source.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
'''def version_sort_key(version):
''',
'''def version_major_minor(version):
    parts = str(version or "").strip().split(".")

    if len(parts) < 2:
        return None

    try:
        return int(parts[0]), int(parts[1])
    except (TypeError, ValueError):
        return None


def same_release_family(left, right):
    left_family = version_major_minor(left)
    right_family = version_major_minor(right)
    return bool(left_family and right_family and left_family == right_family)


def version_sort_key(version):
'''
              ),
              (
'''        version = str(entry.get("version") or "").strip()

        if version:
            result[normalize_version(version)] = entry
''',
'''        ipa_version = str(entry.get("ipaVersion") or "").strip()
        version = str(entry.get("version") or "").strip()

        for candidate in (ipa_version, version):
            if candidate:
                result.setdefault(normalize_version(candidate), entry)
'''
              ),
              (
'''    if is_store_current:
''',
'''    is_store_family = bool(
        store_version
        and same_release_family(store_version, version)
    )

    if is_store_current or is_store_family:
'''
              ),
              (
'''        return release_date, release_notes, "apple"
''',
'''        metadata_source = "apple" if is_store_current else "apple-family"
        return release_date, release_notes, metadata_source
'''
              ),
              (
'''    store_bundle = ""

    if isinstance(store, dict):
        store_bundle = str(store.get("bundleId") or "").strip()
''',
'''    store_bundle = ""
    store_version = ""

    if isinstance(store, dict):
        store_bundle = str(store.get("bundleId") or "").strip()
        store_version = str(store.get("version") or "").strip()
'''
              ),
              (
'''        version = str(version).strip()
        drive_file_id = str(storage.get("drive_file_id") or "").strip()
''',
'''        version = str(version).strip()
        is_current_ipa = (
            normalize_version(version) == normalize_version(current_version)
        )
        display_version = (
            store_version
            if is_current_ipa and store_version
            else version
        )
        drive_file_id = str(storage.get("drive_file_id") or "").strip()
'''
              ),
              (
'''        version_entries.append(
            {
                "version": version,
                "buildVersion": build,
                "date": release_date,
                "size": size,
                "downloadURL": download_url,
                "localizedDescription": release_notes,
            }
        )
''',
'''        version_entry = {
            "version": display_version,
            "ipaVersion": version,
            "buildVersion": build,
            "size": size,
            "downloadURL": download_url,
            "localizedDescription": release_notes,
        }

        if release_date:
            version_entry["date"] = release_date

        version_entries.append(version_entry)
'''
              ),
              (
'''    version_entries.sort(
        key=lambda item: version_sort_key(item.get("version")),
        reverse=True,
    )
''',
'''    version_entries.sort(
        key=lambda item: version_sort_key(
            item.get("ipaVersion") or item.get("version")
        ),
        reverse=True,
    )
'''
              ),
              (
'''            normalize_version(item.get("version")) != current_normalized
''',
'''            normalize_version(
                item.get("ipaVersion") or item.get("version")
            ) != current_normalized
'''
              ),
              (
'''            normalize_version(version_entry.get("version"))
            == current_normalized
''',
'''            normalize_version(
                version_entry.get("ipaVersion")
                or version_entry.get("version")
            ) == current_normalized
'''
              ),
              (
