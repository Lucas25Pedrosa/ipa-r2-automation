name: WhatsApp Duplicados

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação"
        required: true
        default: "test-all"
        type: choice
        options:
          - test-all
          - test-one
          - publish
          - bootstrap
      clone:
        description: "Clone (usado somente em test-one)"
        required: true
        default: "II"
        type: choice
        options:
          - I
          - II
          - III
          - IV
          - V
          - VI

permissions:
  contents: read

concurrency:
  group: ipa-r2-core-write
  cancel-in-progress: false

jobs:
  whatsapp-duplicates:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Core privado
        uses: actions/checkout@v6
        with:
          repository: Lucas25Pedrosa/ipa-r2-core
          token: ${{ secrets.R2_CORE_TOKEN }}
          path: private-core

      - name: Baixar configuração compartilhada
        uses: actions/checkout@v6
        with:
          repository: Lucas25Pedrosa/ipa-shared-config-core
          token: ${{ secrets.DRIVE_INDEX_WRITE_TOKEN }}
          path: shared-config
          fetch-depth: 1

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow

      - name: Preparar área dos WhatsApps duplicados no Google Drive
        if: ${{ inputs.action == 'bootstrap' }}
        id: drive_bootstrap
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          WHATSAPP_DUPLICATES_FOLDER_NAME: WhatsApp Duplicados
          WHATSAPP_DUPLICATES_DRIVE_INDEX: shared-config/whatsapp_duplicates_drive_index.json
        run: |
          python private-core/whatsapp_duplicates/drive.py bootstrap

      - name: Salvar índice do bootstrap
        if: ${{ inputs.action == 'bootstrap' }}
        env:
          FOLDER_ID: ${{ steps.drive_bootstrap.outputs.duplicates_folder_id }}
        run: |
          cd shared-config

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add whatsapp_duplicates_drive_index.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no índice dos WhatsApps duplicados."
            exit 0
          fi

          git commit -m "Update WhatsApp duplicates Drive index"
          git pull --rebase origin main
          git push origin main

          echo "Índice salvo. Pasta dos duplicados: ${FOLDER_ID}"

      - name: Baixar WhatsApp atual do Google Drive
        if: ${{ inputs.action == 'test-all' || inputs.action == 'test-one' || inputs.action == 'publish' }}
        id: source
        env:
          ACTION: ${{ inputs.action }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          set -o pipefail
          mkdir -p work/duplicates

          if ! python private-core/whatsapp_duplicates/source.py \
            --index shared-config/drive_index.json \
            --output work/WhatsApp.ipa \
            2>&1 | tee work/source.log
          then
            if [ "${ACTION}" = "publish" ]; then
              {
                echo "Falha ao baixar ou validar a IPA base do WhatsApp."
                tail -n 25 work/source.log
              } > work/publish_error.txt
            fi
            exit 1
          fi

      - name: Gerar e validar WhatsApps duplicados
        if: ${{ inputs.action == 'test-all' || inputs.action == 'test-one' || inputs.action == 'publish' }}
        env:
          ACTION: ${{ inputs.action }}
          SELECTED_CLONE: ${{ inputs.clone }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail

          if [ "${ACTION}" = "test-one" ]; then
            CLONES="${SELECTED_CLONE}"
          else
            CLONES="I II III IV V VI"
          fi

          for CLONE in ${CLONES}; do
            OUTPUT="work/duplicates/Magda_WA_${CLONE}_${VERSION}.ipa"
            LOG="work/clone-${CLONE}.log"

            echo "========================================"
            echo "Gerando Magda WA ${CLONE}"
            echo "Versão base: ${VERSION}"
            echo "========================================"

            if ! python private-core/whatsapp_duplicates/builder.py \
              --input work/WhatsApp.ipa \
              --clone "${CLONE}" \
              --output "${OUTPUT}" \
              2>&1 | tee "${LOG}"
            then
              if [ "${ACTION}" = "publish" ]; then
                {
                  echo "Magda WA ${CLONE} falhou durante a geração ou validação."
                  tail -n 25 "${LOG}"
                } > work/publish_error.txt
              fi
              exit 1
            fi

            if [ "${ACTION}" = "test-all" ]; then
              rm -f "${OUTPUT}"
            fi
          done

          echo "Geração concluída com sucesso."

      - name: Publicar conjunto no Google Drive
        if: ${{ inputs.action == 'publish' }}
        id: publish
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_PUBLIC_BASE_URL: https://drive.lucaspedrosa.shop
          WHATSAPP_DUPLICATES_DRIVE_INDEX: shared-config/whatsapp_duplicates_drive_index.json
        run: |
          set -o pipefail

          if ! python private-core/whatsapp_duplicates/publish.py \
            --directory work/duplicates \
            2>&1 | tee work/publish.log
          then
            {
              echo "Falha ao publicar o conjunto de WhatsApps duplicados no Google Drive."
              tail -n 35 work/publish.log
            } > work/publish_error.txt
            exit 1
          fi

      - name: Salvar índice após publicação
        if: ${{ inputs.action == 'publish' }}
        run: |
          set -o pipefail

          if ! (
            cd shared-config

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add whatsapp_duplicates_drive_index.json

            if git diff --cached --quiet; then
              echo "Nenhuma alteração no índice dos WhatsApps duplicados."
              exit 0
            fi

            git commit -m "Publish WhatsApp duplicates to Drive"
            git pull --rebase origin main
            git push origin main
          ) 2>&1 | tee work/index-save.log
          then
            {
              echo "Os arquivos foram processados, mas falhou ao salvar o índice dedicado."
              tail -n 25 work/index-save.log
            } > work/publish_error.txt
            exit 1
          fi

      - name: Enviar erro ao Telegram
        if: ${{ failure() && inputs.action == 'publish' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_EMOJIS_FILE: shared-config/custom_emojis.json
        run: |
          python private-core/whatsapp_duplicates/notify_failure.py \
            --reason-file work/publish_error.txt

      - name: Disponibilizar IPA do teste individual
        if: ${{ inputs.action == 'test-one' }}
        uses: actions/upload-artifact@v4
        with:
          name: magda-wa-${{ inputs.clone }}-${{ steps.source.outputs.version }}
          path: work/duplicates/*.ipa
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
